name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project
        run: |
          IDX=$(find . -name index.html -not -path './.git/*' | head -n 1)
          [ -n "$IDX" ] || { echo "index.html not found in repo"; exit 1; }
          P="$RUNNER_TEMP/proj"
          echo "PROJ=$P" >> "$GITHUB_ENV"
          mkdir -p "$P/app/src/main/assets" "$P/app/src/main/java/com/example/chessadvisor" "$P/app/src/main/res/drawable" "$P/app/src/main/res/values" "$P/app/src/main/res/values-night"
          cp "$IDX" "$P/app/src/main/assets/index.html"
          cd "$P"
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ChessAdvisor"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.chessadvisor'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.example.chessadvisor'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="Шахматный советник"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".OverlayService"
                      android:exported="false" />
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/example/chessadvisor/MainActivity.java <<'EOF'
          package com.example.chessadvisor;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  checkOverlayAndStart();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (Settings.canDrawOverlays(this)) {
                      startOverlay();
                  }
              }

              private void checkOverlayAndStart() {
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "Разрешите работу поверх других окон", Toast.LENGTH_LONG).show();
                      Intent intent = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:" + getPackageName()));
                      startActivityForResult(intent, 100);
                  } else {
                      startOverlay();
                  }
              }

              private void startOverlay() {
                  startService(new Intent(this, OverlayService.class));
                  finish();
              }
          }
          EOF
          cat > app/src/main/java/com/example/chessadvisor/OverlayService.java <<'EOF'
          package com.example.chessadvisor;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.os.Build;
          import android.os.IBinder;
          import android.util.DisplayMetrics;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class OverlayService extends Service {
              private WindowManager wm;
              private LinearLayout rootLayout;
              private WebView webView;
              private WindowManager.LayoutParams params;
              private boolean isMinimized = false;
              private int expandedWidth;
              private int expandedHeight;

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public void onCreate() {
                  super.onCreate();
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  DisplayMetrics dm = getResources().getDisplayMetrics();
                  float density = dm.density;

                  expandedWidth = (int) (320 * density);
                  expandedHeight = (int) (440 * density);

                  int layoutFlag = (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                          ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                          : WindowManager.LayoutParams.TYPE_PHONE;

                  params = new WindowManager.LayoutParams(
                          expandedWidth,
                          expandedHeight,
                          layoutFlag,
                          WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                          PixelFormat.TRANSLUCENT
                  );
                  params.gravity = Gravity.TOP | Gravity.START;
                  params.x = 40;
                  params.y = 120;

                  rootLayout = new LinearLayout(this);
                  rootLayout.setOrientation(LinearLayout.VERTICAL);
                  rootLayout.setBackgroundColor(Color.parseColor("#EE1E1E1E"));

                  LinearLayout header = new LinearLayout(this);
                  header.setOrientation(LinearLayout.HORIZONTAL);
                  header.setBackgroundColor(Color.parseColor("#2F6F3E"));
                  header.setGravity(Gravity.CENTER_VERTICAL);
                  int pad = (int) (8 * density);
                  header.setPadding(pad, pad / 2, pad, pad / 2);

                  TextView title = new TextView(this);
                  title.setText("♟ Советник");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(14);
                  LinearLayout.LayoutParams titleParams = new LinearLayout.LayoutParams(
                          0, LinearLayout.LayoutParams.WRAP_CONTENT, 1.0f);
                  header.addView(title, titleParams);

                  Button minBtn = new Button(this);
                  minBtn.setText("—");
                  minBtn.setTextColor(Color.WHITE);
                  minBtn.setBackgroundColor(Color.TRANSPARENT);
                  minBtn.setPadding(pad, 0, pad, 0);

                  Button closeBtn = new Button(this);
                  closeBtn.setText("✕");
                  closeBtn.setTextColor(Color.WHITE);
                  closeBtn.setBackgroundColor(Color.TRANSPARENT);
                  closeBtn.setPadding(pad, 0, pad, 0);

                  header.addView(minBtn);
                  header.addView(closeBtn);

                  webView = new WebView(this) {
                      @Override
                      public boolean onTouchEvent(MotionEvent event) {
                          if (event.getAction() == MotionEvent.ACTION_DOWN) {
                              if ((params.flags & WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE) != 0) {
                                  params.flags &= ~WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE;
                                  wm.updateViewLayout(rootLayout, params);
                              }
                          }
                          return super.onTouchEvent(event);
                      }
                  };
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");

                  LinearLayout.LayoutParams webParams = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, 0, 1.0f);

                  rootLayout.addView(header, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT));
                  rootLayout.addView(webView, webParams);

                  header.setOnTouchListener(new View.OnTouchListener() {
                      private int initialX, initialY;
                      private float initialTouchX, initialTouchY;

                      @Override
                      public boolean onTouch(View v, MotionEvent event) {
                          switch (event.getAction()) {
                              case MotionEvent.ACTION_DOWN:
                                  params.flags |= WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE;
                                  wm.updateViewLayout(rootLayout, params);
                                  initialX = params.x;
                                  initialY = params.y;
                                  initialTouchX = event.getRawX();
                                  initialTouchY = event.getRawY();
                                  return true;
                              case MotionEvent.ACTION_MOVE:
                                  params.x = initialX + (int) (event.getRawX() - initialTouchX);
                                  params.y = initialY + (int) (event.getRawY() - initialTouchY);
                                  wm.updateViewLayout(rootLayout, params);
                                  return true;
                          }
                          return false;
                      }
                  });

                  minBtn.setOnClickListener(v -> {
                      isMinimized = !isMinimized;
                      if (isMinimized) {
                          webView.setVisibility(View.GONE);
                          params.width = (int) (180 * density);
                          params.height = WindowManager.LayoutParams.WRAP_CONTENT;
                          params.flags |= WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE;
                          minBtn.setText("▢");
                      } else {
                          webView.setVisibility(View.VISIBLE);
                          params.width = expandedWidth;
                          params.height = expandedHeight;
                          minBtn.setText("—");
                      }
                      wm.updateViewLayout(rootLayout, params);
                  });

                  closeBtn.setOnClickListener(v -> stopSelf());

                  wm.addView(rootLayout, params);
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (rootLayout != null) {
                      wm.removeView(rootLayout);
                  }
              }
          }
          EOF
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Translucent.NoTitleBar" />
          </resources>
          EOF
          cat > app/src/main/res/values-night/themes.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Translucent.NoTitleBar" />
          </resources>
          EOF
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#2F6F3E" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#FFFFFF" android:pathData="M43,32a11,11 0 1,0 22,0a11,11 0 1,0 -22,0z" />
              <path android:fillColor="#FFFFFF" android:pathData="M45,78L63,78L59,46L49,46z" />
              <path android:fillColor="#FFFFFF" android:pathData="M38,78L70,78L70,86L38,86z" />
          </vector>
          EOF

      - name: Build debug APK
        run: |
          cd "$PROJ"
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/chess-advisor.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: chess-advisor-apk
          path: chess-advisor.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Шахматный советник (сборка ${{ github.run_number }})"
          files: chess-advisor.apk
