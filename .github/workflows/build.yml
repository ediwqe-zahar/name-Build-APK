name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

       - name: Accept Android licenses
         run: |
             mkdir -p "$ANDROID_HOME/licenses"
             echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
             echo "8933bad161af4178b1185d1a37fbf41ea5269c55" >> "$ANDROID_HOME/licenses/android-sdk-license"
             echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
             yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project
        run: |
          IDX=$(find . -name index.html -not -path './.git/*' | head -n 1)
          [ -n "$IDX" ] || { echo "index.html not found in repo"; exit 1; }
          P="$RUNNER_TEMP/proj"
          echo "PROJ=$P" >> "$GITHUB_ENV"
          mkdir -p "$P/app/src/main/assets" "$P/app/src/main/java/com/example/chessadvisor" "$P/app/src/main/res/drawable" "$P/app/src/main/res/values" "$P/app/src/main/res/values-night"
          cp "$IDX" "$P/app/src/main/assets/index.html"
          cd "$P"
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ChessAdvisor"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.chessadvisor'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.example.chessadvisor'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="Шахматный советник"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/example/chessadvisor/MainActivity.java <<'EOF'
          package com.example.chessadvisor;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  web.setWebViewClient(new WebViewClient());
                  web.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.DeviceDefault.Light.NoActionBar" />
          </resources>
          EOF
          cat > app/src/main/res/values-night/themes.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.DeviceDefault.NoActionBar" />
          </resources>
          EOF
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#2F6F3E" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#FFFFFF" android:pathData="M43,32a11,11 0 1,0 22,0a11,11 0 1,0 -22,0z" />
              <path android:fillColor="#FFFFFF" android:pathData="M45,78L63,78L59,46L49,46z" />
              <path android:fillColor="#FFFFFF" android:pathData="M38,78L70,78L70,86L38,86z" />
          </vector>
          EOF

      - name: Build debug APK
        run: |
          cd "$PROJ"
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/chess-advisor.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: chess-advisor-apk
          path: chess-advisor.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Шахматный советник (сборка ${{ github.run_number }})
          files: chess-advisor.apk
